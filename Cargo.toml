[package]
name = "mc-tunnel"
version = "0.1.0"
edition = "2021"
description = "Minecraft traffic camouflage proxy tunnel"

[lib]
name = "mc_tunnel"
path = "src/lib.rs"

[[bin]]
name = "mc-tunnel"
path = "src/main.rs"

[[bin]]
name = "mc-tunnel-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:egui"]

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maxminddb = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.5"
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.29", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
strip = true
codegen-units = 1
